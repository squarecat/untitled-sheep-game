<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheepdog Trials</title>
<style>
  :root {
    --bg-top: #bfe3f2;
    --bg-bottom: #e8f4d9;
    --ink: #2b2a26;
    --panel: rgba(255, 252, 242, 0.88);
    --dog1: #d6453d;
    --dog2: #2f6fd6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    font-family: ui-rounded, "Nunito", system-ui, sans-serif;
    color: var(--ink);
    user-select: none;
  }
  canvas { display: block; }
  .hud {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; gap: 12px; pointer-events: none;
  }
  .panel {
    background: var(--panel); border-radius: 12px; padding: 8px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); font-size: 15px; line-height: 1.5;
  }
  .stat { font-size: 20px; font-weight: 800; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  kbd {
    font-family: inherit; font-size: 12px; font-weight: 700; background: #fff;
    border: 1px solid #ccc; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
  }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; transition: opacity 0.4s;
  }
  .overlay.hidden { opacity: 0; }
  .card { background: var(--panel); border-radius: 16px; padding: 20px 28px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.18); }
  .card h1 { margin: 0 0 6px; font-size: 28px; }
  .card p { margin: 4px 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="panel">
    <div id="levelName" style="font-weight:700"></div>
    <div class="stat">🐑 <span id="penned">0</span>/<span id="total">0</span> penned</div>
    <div>⏱ <span id="time">0:00.0</span></div>
  </div>
  <div class="panel">
    <div><span class="dot" style="background:var(--dog1)"></span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Red dog</div>
    <div><span class="dot" style="background:var(--dog2)"></span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> Blue dog</div>
    <div><kbd>R</kbd> restart &nbsp; <kbd>M</kbd> mute &nbsp; <kbd>1</kbd><kbd>2</kbd> level</div>
  </div>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <h1 id="introTitle">Sheepdog Trials</h1>
    <p id="introText"></p>
    <p>Move slowly to keep them calm — rush in and they'll scatter!</p>
    <p><b>Press any movement key to start</b></p>
  </div>
</div>

<div class="overlay hidden" id="win">
  <div class="card">
    <h1>All penned! 🎉</h1>
    <p>Time: <b id="winTime"></b></p>
    <p id="best"></p>
    <p id="winNext"></p>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
